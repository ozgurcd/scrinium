name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Confirm Go toolchain
        run: go version

      # The tree must be clean BEFORE goreleaser runs — measured with the
      # same definition Go's build stamper uses (`git status --porcelain`:
      # tracked changes AND untracked files both stamp vcs.modified=true).
      # The old diff-index check passed seconds before the v0.2.1 binaries
      # stamped +dirty: goreleaser's own unignored dist/ output was the
      # untracked file that dirtied every release build by construction
      # (fixed by gitignoring dist/; this guard catches the next such case).
      - name: Refuse an unclean tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "unclean tree — Go stamps vcs.modified=true for tracked or untracked changes; release must be reproducible from its tag"
            git status --porcelain
            exit 1
          fi

      # Provenance teeth now live INSIDE the release as a per-build post
      # hook (.goreleaser.yaml): every binary is asserted vcs.modified=false
      # at build time, BEFORE archiving and publication — the run 32584410033
      # failure fired only after GoReleaser had already published, which is
      # the wrong side of the gate (same doctrine as the image pipelines:
      # scan before registry login).
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
