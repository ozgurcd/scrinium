name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ozgurcd/lictor/.github/actions/go-toolchain@d35a8ad07dc59bd76153f0ed7d3b1ade22c6cf04 # v0.4.6-6-gd35a8ad (untagged action snapshot)
      - name: Confirm Go toolchain
        run: go version

      - name: Install verification tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      # `make verify` runs `rulefloor check` and refuses any Rulefloor other
      # than the Makefile's RULEFLOOR_VERSION. The release archive is checked
      # twice before use: against the release's published checksums.txt, and
      # against the sha256 pinned here, so a replaced release asset cannot
      # pass. A version bump edits RULEFLOOR_VERSION in the Makefile and the
      # two values below; a bump made in only one place fails the gate.
      - name: Install Rulefloor (pinned release, checksum-verified)
        env:
          RULEFLOOR_VERSION: v0.9.3
          RULEFLOOR_SHA256: ad853cbc6dcc9601aaa713f939b63206f68d4bb259f5d17c4631942fc079ea97
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/rulefloor.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          archive="rulefloor_${RULEFLOOR_VERSION#v}_linux_amd64.tar.gz"
          base="https://github.com/ozgurcd/rulefloor/releases/download/${RULEFLOOR_VERSION}"
          curl -fsSL -o "$work/$archive" "$base/$archive"
          curl -fsSL -o "$work/checksums.txt" "$base/checksums.txt"
          (cd "$work" && grep -F "  $archive" checksums.txt | sha256sum -c -)
          echo "${RULEFLOOR_SHA256}  $work/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rulefloor-bin"
          tar -xzf "$work/$archive" -C "$RUNNER_TEMP/rulefloor-bin" rulefloor
          "$RUNNER_TEMP/rulefloor-bin/rulefloor" version --json
          echo "$RUNNER_TEMP/rulefloor-bin" >> "$GITHUB_PATH"

      - name: Verify
        run: make verify
