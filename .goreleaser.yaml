version: 2
project_name: scrinium

builds:
  - env:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=go1.27.0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X scrinium/cmd/scrinium.version={{.Version}}
    hooks:
      # Provenance assert BEFORE publication: each binary must stamp
      # vcs.modified=false the moment it is built, failing the release
      # while nothing has been uploaded. GoReleaser OSS cannot split
      # build/assert/publish into separate runs without rebuilding
      # (release --skip=publish then release --clean would publish a
      # DIFFERENT build than the one asserted; `continue` is Pro-only),
      # so the assert rides the build itself. v0.2.0 and v0.2.1 shipped
      # vcs.modified=true because goreleaser's own unignored dist/
      # output dirtied the tree mid-run; the post-publish workflow step
      # that caught it on v0.2.1 fired only AFTER publication.
      post:
        - cmd: >-
            sh -c 'go version -m "{{ .Path }}" | grep -q "vcs.modified=false"
            || { echo "PROVENANCE FAIL — {{ .Path }} stamps a modified tree";
            go version -m "{{ .Path }}" | grep vcs; exit 1; }'
        # Stamp assert: the binary's OWN `version` output must equal the
        # release version. `go version -m` reads the MODULE version from
        # the tag and would look right even with a broken ldflags stamp —
        # nothing verified GoReleaser's injected string until this hook.
        # Only the host-runnable build is executed (cross-compiled
        # binaries cannot exec on the runner); the ldflags line is shared
        # by every build, so one platform's stamp proves the template for
        # all four.
        - cmd: >-
            sh -c 'if [ "$(go env GOOS)/$(go env GOARCH)" = "{{ .Os }}/{{ .Arch }}" ];
            then got="$("{{ .Path }}" version)";
            [ "$got" = "scrinium {{ .Version }}" ]
            || { echo "STAMP FAIL — {{ .Path }} prints \"$got\", want \"scrinium {{ .Version }}\""; exit 1; };
            fi'

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

release:
  replace_existing_artifacts: true

# Homebrew publication is deliberately ABSENT (2026-08-22). The tap
# (ozgurcd/homebrew-tap) ships a hand-maintained SOURCE-BUILD formula on
# rulefloor's mechanism: tag tarball + `go build` with the version ldflag.
# GoReleaser can only generate artifact-download install methods (`brews`
# formulae and `homebrew_casks` both pin release archives), so any
# publication block here would overwrite that formula on the next release
# — the previous `homebrew_casks` block did exactly that class of damage:
# it published a cask whose quarantined, unnotarized binary Gatekeeper
# SIGKILLed on install (measured: the identical binary runs with the
# quarantine xattr removed and is killed with it present). Releasing a new
# version means bumping url+sha256 in the tap's Formula/scrinium.rb by
# hand, exactly like rulefloor.
